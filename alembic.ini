# Development only: `uv run alembic revision --autogenerate -m "..."`.
# The URL comes from MIGRATION_DATABASE_URL / DATABASE_URL (see migrations/env.py), never
# from this file. At runtime, `garminagent db-upgrade` runs migrations without it.
[alembic]
script_location = src/garminagent/storage/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
