[project]
name = "garminagent"
version = "0.1.0"
description = "AI-assisted training planning on Garmin Connect data"
readme = "README.md"
authors = [
    { name = "Ilari Lehtonen", email = "ilari.lehtonen@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
garminagent = "garminagent.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# The single source for the uv version: CI's setup-uv reads it, and uv refuses to run the
# project with any other version (locally and in the Docker build). When upgrading, change
# this, the uv image in the Dockerfile and the uv_build bound above together.
required-version = "==0.13.5"

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a Postgres database at TEST_DATABASE_URL"]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
