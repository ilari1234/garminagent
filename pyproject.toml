[project]
name = "garminagent"
version = "0.1.0"
description = "AI-assisted training planning on Garmin Connect data"
readme = "README.md"
authors = [
    { name = "Ilari Lehtonen", email = "ilari.lehtonen@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.123",
    "garmin-fit-sdk>=21.218.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
garminagent = "garminagent.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# The single source for the uv version: CI's setup-uv reads it, and uv refuses to run the
# project with any other version (locally and in the Docker build). When upgrading, change
# this, the uv image in the Dockerfile and the uv_build bound above together.
required-version = "==0.13.6"

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["src", "tests", "infra/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use obviously fake credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests", "scripts", "infra/scripts"]
# Setting extraPaths turns off the automatic "src" path, so both are listed. infra/scripts
# holds standalone tools (no package); tests import them by module name.
extraPaths = ["src", "infra/scripts"]
pythonVersion = "3.15"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra/scripts"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a Postgres database at TEST_DATABASE_URL"]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
    "zizmor>=1.31.1",
]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "types-boto3[s3]>=1.43.123",
]
